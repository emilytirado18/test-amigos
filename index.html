<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué tanto me conoces?</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#f8e8f7,#e9e4ff);
  color: #46344f;
  min-height: 100vh;
}

main {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 12px 35px #694b8420;
}

h1, h2 {
  color: #8658a6;
  text-align: center;
}

p { line-height: 1.5; }

.center { text-align: center; }

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #cbb4dc;
  border-radius: 12px;
  margin: 10px 0;
}

button {
  background: #9166b5;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px 22px;
  cursor: pointer;
  font-size: 16px;
  margin: 5px;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.secondary {
  background: #e8d9f2;
  color: #5b3d72;
}

.hidden { display: none; }

.progress {
  height: 12px;
  background: #eee3f4;
  border-radius: 20px;
  overflow: hidden;
  margin: 22px 0;
}

.bar {
  height: 100%;
  width: 0;
  background: #a77bd0;
  transition: width .3s;
}

.question {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 30px 0;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.result {
  padding: 15px;
  background: #f7f0fb;
  border-radius: 12px;
  margin: 12px 0;
}

.good { border-left: 5px solid #71b18a; }
.review { border-left: 5px solid #e3af68; }

.small {
  font-size: 13px;
  color: #74667c;
}

.error { color: #b63759; }
.danger { background: #b94063; }
.danger:hover { background: #9f3151; }

/* Hortensia azul al terminar el test */
#florPantalla {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  background: linear-gradient(145deg,#e8efff,#f4eaff,#e3f4ff);
}
#florPantalla.hidden { display: none !important; }
.florTarjeta { max-width: 440px; width: 100%; }
.florTarjeta h2 { color: #5472bb; margin: 6px 0; }
.florTarjeta p { color: #615b80; }
.hortensia { width: min(300px,80vw); height: auto; overflow: visible; }
.hortensia .ramo { transform-origin: 150px 190px; animation: balanceo 3s ease-in-out infinite; }
.hortensia .florecita { opacity: 0; transform-box: fill-box; transform-origin: center;
  animation: abrirFlor .7s cubic-bezier(.2,1.3,.4,1) forwards;
  animation-delay: var(--retardo); }
.hortensia .brillo { animation: palpitar 2.2s ease-in-out infinite alternate; }
@keyframes abrirFlor { from { opacity:0; transform:scale(.1) rotate(-35deg); }
  to { opacity:1; transform:scale(1) rotate(0); } }
@keyframes balanceo { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2deg); } }
@keyframes palpitar { from { opacity:.45; } to { opacity:1; } }
@media (prefers-reduced-motion: reduce) {
  .hortensia .ramo,.hortensia .brillo { animation:none; }
  .hortensia .florecita { animation:none; opacity:1; }
}
  
.corazonAzul {
  font-size: 65px;
  margin: 12px auto;
  filter: drop-shadow(0 0 16px #65b9ff);
  animation: latidoCorazon 1.5s ease-in-out infinite;
}

@keyframes latidoCorazon {
  0%, 100% {
    transform: scale(1);
    filter: drop-shadow(0 0 8px #80caff);
  }

  50% {
    transform: scale(1.25);
    filter: drop-shadow(0 0 24px #369bff);
  }
}

</style>
</head>

<body>
<main>

<section id="bienvenidos">
  <h1>💜 ¿Qué tanto me conoces?</h1>
  <p class="center">
    Responde 20 preguntas y descubre
    cuánto sabes de mí.
  </p>

  <input id="nombre" maxlength="80"
    placeholder="Escribe tu nombre">

  <div class="center">
    <button onclick="comenzar()">Comenzar test</button>
  </div>
</section>

<section id="juego" class="hidden">
  <p id="contador" class="center"></p>

  <div class="progress">
    <div id="barra" class="bar"></div>
  </div>

  <div id="pregunta" class="question"></div>

  <input id="respuesta"
    maxlength="500"
    placeholder="Escribe tu respuesta..."
    oninput="guardarTemporal()">

  <div class="navigation">
    <button class="secondary"
      onclick="anterior()">Anterior</button>

    <button id="siguiente"
      onclick="siguiente()">Siguiente</button>
  </div>

  <p id="estado" class="center"></p>
</section>

<section id="final" class="hidden">
  <h1>Tu resultado</h1>
  <div id="resultado"></div>
</section>

<section id="admin" class="hidden">
  <h2>Panel de administración</h2>

  <div id="login">
    <input id="correo" type="email"
      placeholder="Correo electrónico">

    <input id="clave" type="password"
      placeholder="Contraseña">

    <button onclick="iniciarSesion()">
      Iniciar sesión
    </button>
  </div>

  <div id="panel" class="hidden">
    <button onclick="cargarResultados()">
      Actualizar resultados
    </button>

    <button class="secondary"
      onclick="cerrarSesion()">
      Cerrar sesión
    </button>

    <div id="lista"></div>
  </div>

  <p id="estadoAdmin"></p>
</section>

</main>

<!-- Animación de hortensia azul: solo se muestra al guardar correctamente -->
<section id="florPantalla" class="hidden" role="status" aria-live="polite">
  <div class="florTarjeta">
    <svg class="hortensia" viewBox="0 0 300 330" role="img" aria-label="Hortensia azul floreciendo">
      <defs>
        <linearGradient id="petaloAzul" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c1dcff"/>
          <stop offset="0.55" stop-color="#729de9"/>
          <stop offset="1" stop-color="#5275ce"/>
        </linearGradient>
        <linearGradient id="talloVerde" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7ab89c"/><stop offset="1" stop-color="#3b8e78"/>
        </linearGradient>
      </defs>
      <g class="ramo">
        <path d="M150 188 Q155 246 145 315" stroke="url(#talloVerde)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M149 268 Q100 219 77 248 Q106 294 149 279" fill="#70b7a1"/>
        <path d="M151 289 Q198 242 223 262 Q203 308 151 298" fill="#65aa96"/>
        <g id="racimoHortensia"></g>
      </g>
    </svg>
    <div class="corazonAzul">💙</div>
    <h2>¡Gracias por responder!</h2>
    <p>Una hortensia azul para ti. Preparando tu resultado...</p>
  </div>
</section>


<script>
// Dibujar pequeñas flores de la hortensia azul.
(function crearHortensia() {
  const ns="http://www.w3.org/2000/svg";
  const grupo=document.getElementById("racimoHortensia");
  const centros=[
    [150,58],[111,74],[187,76],[86,111],[127,108],[169,105],[210,112],
    [74,150],[111,148],[151,145],[191,148],[225,152],
    [91,187],[131,186],[172,187],[209,188],
    [115,220],[154,219],[191,217],[151,253]
  ];
  centros.forEach(([x,y],i)=>{
    const flor=document.createElementNS(ns,"g");
    flor.setAttribute("class","florecita");
    flor.setAttribute("transform",`translate(${x} ${y})`);
    flor.style.setProperty("--retardo",`${i*0.075}s`);
    [0,90,180,270].forEach(angulo=>{
      const petalo=document.createElementNS(ns,"ellipse");
      petalo.setAttribute("cx","0");petalo.setAttribute("cy","-12");
      petalo.setAttribute("rx","12");petalo.setAttribute("ry","17");
      petalo.setAttribute("transform",`rotate(${angulo})`);
      petalo.setAttribute("fill","url(#petaloAzul)");
      petalo.setAttribute("stroke","#e0ebff");
      petalo.setAttribute("stroke-width","1");
      flor.appendChild(petalo);
    });
    const centro=document.createElementNS(ns,"circle");
    centro.setAttribute("r","4.5");centro.setAttribute("fill","#fff3b5");
    centro.setAttribute("class","brillo");flor.appendChild(centro);
    grupo.appendChild(flor);
  });
})();

function mostrarHortensia() {
  const pantalla=document.getElementById("florPantalla");
  pantalla.classList.remove("hidden");
  // Reiniciar el florecimiento cada vez que se complete el test.
  pantalla.querySelectorAll(".florecita").forEach(flor=>{
    flor.style.animation="none";
    void flor.getBoundingClientRect();
    flor.style.animation="";
  });
  setTimeout(()=>pantalla.classList.add("hidden"),3300);
}

// CONEXIÓN SUPABASE
const URL_BASE =
  "https://ehxrmqbthxndcfmwjhmq.supabase.co";

const API_KEY =
  "sb_publishable_LRVbj9lMIeAzTVJ-OxzIFA_2iHKkzRp";

let tokenAdmin = null;
let enviando = false;

// PREGUNTAS Y RESPUESTAS ACEPTADAS
const datos = [
["¿Cuál es mi color favorito?",["azul"]],
["¿Cuándo es mi cumpleaños?",
 ["28 de noviembre","28 noviembre","28/11"]],
["¿Cuál es mi comida favorita?",
 ["cualquier tipo de carne","cualquier carne","todo tipo de carne"]],
["¿Prefiero el día o la noche?",["noche"]],
["¿Cuál es mi canción favorita?",
 ["todos los generos","todos los generos musicales","cualquier genero musical"]],
["¿Qué es lo que más me hace enojar?",
 ["cuando se meten con los animales o se meten conmigo o con mi familia","que se metan con los animales conmigo o con mi familia"]],
["¿Qué hago cuando estoy triste?",
 ["lloro y veo videos graciosos","llorar y ver videos graciosos"]],
["¿Soy más de salir o quedarme en casa?",
 ["quedarme en casa","estar en casa","casa"]],
["¿Cuál es uno de mis mayores sueños?",
 ["tener una cafeteria de gatitos",
 "cafeteria de gatos","cafeteria con gatitos"]],
["¿Qué tipo de personas me caen mal?",
 ["presumidas y creidas","presumidas",
 "creidas","arrogantes","engreidas"]],
["¿Cuál es mi mayor miedo?",
 ["quedarme sola por mis acciones","quedar sola por mis acciones"]],
["¿Cómo demuestro cariño?",
 ["con abrazos detalles y pasando tiempo con las personas","abrazos detalles y pasando tiempo con las personas"]],
["¿Qué inseguridad tengo?",
 ["mi fisico","fisico","mi apariencia fisica"]],
["¿Qué es lo que más valoro en una amistad?",
 ["honestidad y lealtad","lealtad y honestidad",
 "honestidad","lealtad"]],
["¿Qué cosa me puede hacer llorar fácilmente?",
 ["cuando me esconden la comida y cuando no me escuchan","que me escondan la comida y no me escuchen"]],
["¿Qué hago cuando alguien me decepciona?",
 ["le aplico la ley del hielo por unos cuantos dias","ley del hielo por unos dias"]],
["¿Qué es algo que nunca perdonaría?",
 ["la traicion o la decepcion","la traicion","la decepcion","traicion","decepcion"]],
["¿Qué pequeño detalle me hace muy feliz?",
 ["cualquier detalle pequeño","cualquier detallito","los pequeños detalles","cualquier gesto bonito"]],
["¿Qué es lo que más deseo conseguir en mi vida?",
 ["dinero","plata","mucho dinero"]],
["Si estoy pasando un mal momento, ¿qué necesitaría de ti?",
 ["palabras de apoyo y un heladito",
 "apoyo y helado","palabras de apoyo y helado"]]
];

let orden = [];
let respuestas = Array(20).fill("");
let posicion = 0;
let participante = "";

// MEZCLAR PREGUNTAS
function mezclar(array) {
  for (let i=array.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function mostrar(id) {
  ["bienvenida","juego","final"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function comenzar() {
  participante=document.getElementById("nombre").value.trim();

  if(!participante) {
    alert("Escribe tu nombre.");
    return;
  }

  orden=mezclar([...Array(20).keys()]);
  respuestas=Array(20).fill("");
  posicion=0;

  mostrar("juego");
  mostrarPregunta();
}

function mostrarPregunta() {
  const indice=orden[posicion];

  document.getElementById("contador").textContent=
    "Pregunta "+(posicion+1)+" de 20";

  document.getElementById("barra").style.width=
    ((posicion+1)/20*100)+"%";

  document.getElementById("pregunta").textContent=
    datos[indice][0];

  document.getElementById("respuesta").value=
    respuestas[indice];

  document.getElementById("siguiente").textContent=
    posicion===19?"Terminar":"Siguiente";

  document.getElementById("estado").textContent="";
}

function guardarTemporal() {
  respuestas[orden[posicion]]=
    document.getElementById("respuesta").value;
}

function anterior() {
  guardarTemporal();
  if(posicion>0) {
    posicion--;
    mostrarPregunta();
  }
}

async function siguiente() {
  if(enviando)return;
  guardarTemporal();

  if(!respuestas[orden[posicion]].trim()) {
    alert("Responde antes de continuar.");
    return;
  }

  if(posicion<19) {
    posicion++;
    mostrarPregunta();
  } else {
    if(respuestas.some(r=>!r.trim())) {
      alert("Faltan preguntas por responder.");
      return;
    }
    await finalizar();
  }
}

// CORRECCIÓN FLEXIBLE
function normalizar(texto) {
  return String(texto).toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function evaluar(respuesta,opciones) {
  const r=normalizar(respuesta);
  if(!r)return "pendiente";

  for(const opcion of opciones) {
    const o=normalizar(opcion);

    if(r===o)return "correcta";

    if(o.length>=5 &&
       r.includes(o) &&
       r.length<=o.length+65) {
      return "correcta";
    }
  }
  return "pendiente";
}

function headers(token) {
  return {
    "apikey":API_KEY,
    "Authorization":"Bearer "+(token||API_KEY),
    "Content-Type":"application/json"
  };
}

// GUARDAR EN SUPABASE
async function finalizar() {
  if(enviando)return;
  enviando=true;
  const boton=document.getElementById("siguiente");
  boton.disabled=true;

  document.getElementById("estado").textContent=
    "Guardando respuestas...";

  let puntos=0;
  let pendientes=0;

  const evaluaciones=respuestas.map((r,i)=>{
    const e=evaluar(r,datos[i][1]);
    if(e==="correcta")puntos++;
    else pendientes++;
    return e;
  });

  try {
    const response=await fetch(
      URL_BASE+"/rest/v1/resultados_test",{
        method:"POST",
        headers:{
          ...headers(),
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          nombre:participante,
          respuestas:respuestas,
          puntuacion:puntos,
          pendientes_revision:pendientes
        })
      }
    );

    if(!response.ok) {
      throw new Error(await response.text());
    }

    mostrar("final");
    mostrarHortensia();

    const zona=document.getElementById("resultado");
    zona.replaceChildren();

    const titulo=document.createElement("h2");
    titulo.textContent=
      participante+": "+puntos+"/20 coincidencias";

    const aviso=document.createElement("p");
    aviso.textContent=
      pendientes+" respuestas por revisar.";

    zona.append(titulo,aviso);

    respuestas.forEach((r,i)=>{
      const div=document.createElement("div");
      div.className="result "+(evaluaciones[i]==="correcta"?"good":"review");
      const titulo=document.createElement("strong");
      titulo.textContent=(i+1)+". "+datos[i][0];
      const tuya=document.createElement("p");
      tuya.textContent="Tu respuesta: "+r;
      const correcta=document.createElement("p");
      correcta.textContent="Respuesta correcta: "+datos[i][1][0];
      const estado=document.createElement("small");
      estado.textContent=evaluaciones[i]==="correcta"?"Coincide":"Pendiente de revisión";
      div.append(titulo,tuya,correcta,estado);
      zona.append(div);
    });

  } catch(error) {
    console.error(error);
    document.getElementById("estado").textContent=
      "No se pudo guardar. Inténtalo nuevamente.";
  } finally {
    enviando=false;
    boton.disabled=false;
  }
}

// ADMINISTRACIÓN
function mostrarAdmin() {
  document.getElementById("admin")
    .classList.toggle("hidden");
}

async function iniciarSesion() {
  const email=document.getElementById("correo").value;
  const password=document.getElementById("clave").value;
  const estado=document.getElementById("estadoAdmin");

  estado.textContent="Iniciando sesión...";

  try {
    const r=await fetch(
      URL_BASE+"/auth/v1/token?grant_type=password",{
        method:"POST",
        headers:{
          "apikey":API_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({email,password})
      }
    );

    const d=await r.json();

    if(!r.ok||!d.access_token) {
      throw new Error("No se pudo iniciar sesión.");
    }

    tokenAdmin=d.access_token;

    document.getElementById("login")
      .classList.add("hidden");
    document.getElementById("panel")
      .classList.remove("hidden");

    estado.textContent="Sesión iniciada.";
    await cargarResultados();

  } catch(error) {
    estado.textContent=error.message;
    estado.className="error";
  }
}

async function cargarResultados() {
  const lista=document.getElementById("lista");
  const estado=document.getElementById("estadoAdmin");

  lista.replaceChildren();
  estado.textContent="Cargando...";

  try {
    const r=await fetch(
      URL_BASE+
      "/rest/v1/resultados_test?select=*&order=creado_en.desc&limit=500",
      {headers:headers(tokenAdmin)}
    );

    if(!r.ok)throw new Error("Error al consultar resultados.");

    const registros=await r.json();

    const titulo=document.createElement("h3");
    titulo.textContent="Participaciones: "+registros.length;
    lista.append(titulo);

    registros.forEach(registro=>{
      const div=document.createElement("div");
      div.className="result";

      const nombre=document.createElement("h3");
      nombre.textContent=registro.nombre;

      const puntos=document.createElement("p");
      puntos.textContent=
        "Coincidencias: "+registro.puntuacion+
        "/20 | Por revisar: "+
        registro.pendientes_revision;

      const fecha=document.createElement("p");
      fecha.className="small";
      fecha.textContent=new Date(
        registro.creado_en
      ).toLocaleString("es-EC");

      const detalles=document.createElement("details");
      const resumen=document.createElement("summary");
      resumen.textContent="Ver las 20 respuestas";
      detalles.append(resumen);

      (registro.respuestas||[]).forEach((respuesta,i)=>{
        const p=document.createElement("p");
        p.textContent=
          (i+1)+". "+datos[i][0]+" — Respuesta: "+respuesta+" — Correcta: "+datos[i][1][0];
        detalles.append(p);
      });

      const eliminar=document.createElement("button");
      eliminar.type="button";
      eliminar.className="danger";
      eliminar.textContent="Eliminar registro";
      eliminar.addEventListener("click",()=>eliminarRegistro(registro,eliminar));

      div.append(nombre,puntos,fecha,detalles,eliminar);
      lista.append(div);
    });

    estado.textContent="Resultados cargados.";

  } catch(error) {
    estado.textContent=error.message;
  }
}

// ELIMINAR UNA PARTICIPACIÓN (SOLO ADMINISTRACIÓN)
async function eliminarRegistro(registro,boton) {
  if(!tokenAdmin) {
    alert("Inicia sesión como administradora.");
    return;
  }
  const nombre=String(registro.nombre||"Sin nombre");
  if(!confirm('¿Eliminar definitivamente las respuestas de "'+nombre+'"? Esta acción no se puede deshacer.'))return;

  boton.disabled=true;
  boton.textContent="Eliminando...";
  const estado=document.getElementById("estadoAdmin");
  try {
    const r=await fetch(
      URL_BASE+"/rest/v1/resultados_test?id=eq."+encodeURIComponent(registro.id),
      {
        method:"DELETE",
        headers:{...headers(tokenAdmin),"Prefer":"return=representation"}
      }
    );
    if(!r.ok)throw new Error("Supabase rechazó la eliminación: "+await r.text());
    const eliminados=await r.json();
    if(!Array.isArray(eliminados)||eliminados.length!==1) {
      throw new Error("No se eliminó el registro. Revisa los permisos DELETE de Supabase.");
    }
    await cargarResultados();
    estado.textContent='Registro de "'+nombre+'" eliminado correctamente.';
  } catch(error) {
    console.error(error);
    estado.textContent=error.message;
    estado.className="error";
    boton.disabled=false;
    boton.textContent="Eliminar registro";
  }
}

function cerrarSesion() {
  tokenAdmin=null;

  document.getElementById("panel")
    .classList.add("hidden");

  document.getElementById("login")
    .classList.remove("hidden");

  document.getElementById("lista").replaceChildren();
  document.getElementById("clave").value="";

  document.getElementById("estadoAdmin").textContent=
    "Sesión cerrada.";
}
document.addEventListener("keydown", function(event) {
  if(event.key==="Enter" && !event.repeat && !event.ctrlKey && !event.altKey &&
     !document.getElementById("juego").classList.contains("hidden") &&
     document.activeElement===document.getElementById("respuesta")){
    event.preventDefault();
    siguiente();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "a" && !event.target.matches("input,textarea,[contenteditable]")) {
    event.preventDefault();
    mostrarAdmin();
  }
});
</script>
</body>
</html>
