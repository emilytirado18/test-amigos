.ramo{

@keyframes balanceo{

<body>

<script>

/* PREGUNTAS */

const datos = [

/*
  PALABRAS CLAVE:
  Cada grupo interno exige todas sus palabras.
  Los distintos grupos son alternativas independientes.

  Ejemplo:
  [["dinero"], ["plata"], ["money"]]

*/

const palabrasClave = [
  [["azul"]],
  [["28","noviembre"],["28","11"]],
  [["carne"],["pollo"],["dulces"]],
  [["noche"]],
  [["todos"],["todas"],["generos","musicales"]],
  [["animales"],["familia"],["conmigo"]],

    ["dulces"],["comer","dulces"],["Lloras"]
  ],
  [["casa"]],
  [["cafeteria","gatos"],["cafeteria","gatitos"]],
  [["presumidas"],["creidas"],["arrogantes"]],
  [["sola","acciones"],["sola"]],
[
  ["abrazos"],
  ["detalles"],
  ["tiempo", "personas"],
  ["reir"],

],

  ],

    ["comida"],["chocolates"]
  ]
];

/* GÉNEROS MUSICALES */

const generosMusicales = [
  "pop","pop rock","indie pop","electropop",
  "synth pop","kpop","k pop","jpop","j pop",
  "dance pop","pop latino","balada",
  "rock","rock alternativo","rock clasico",
  "hard rock","indie rock","punk rock",
  "rock progresivo","metal","heavy metal",
  "death metal","black metal","metal sinfonico",
  "nu metal","metalcore","regueton","reggaeton",
  "trap","trap latino","hip hop","hiphop",
  "rap","drill","r&b","rnb","soul","funk",
  "dancehall","afrobeats","electronica",
  "edm","house","deep house","tech house",
  "techno","trance","dubstep","drum and bass",
  "hardstyle","ambient","lofi","lo fi",
  "salsa","bachata","merengue","cumbia",
  "vallenato","tropical","bolero",
  "bossa nova","samba","tango","reggae","ska",
  "ranchera","mariachi","corrido","corridos",
  "corridos tumbados","banda","nortena",

  "albazo","yaravi","pasacalle","andina",

  "gospel","country","folk","disco","new age",
  "flamenco","experimental","shoegaze",
  "grunge","emo","post rock","dream pop",
  "phonk","hyperpop"
];

const respuestasGeneralesMusica = [
  "todos","todas","de todo","todo tipo de musica",
  "todos los generos","todos los generos musicales",
  "cualquier genero","cualquier genero musical",
  "cualquier tipo de musica","me gusta de todo",
  "escucho de todo"
];

respuestas = Array(datos.length).fill("");

/* UTILIDADES */

function normalizar(texto) {
  return String(texto ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function contieneFrase(texto, frase) {
  const clave = normalizar(frase);
  return !!clave && (` ${texto} `).includes(` ${clave} `);
}

function headers(token) {
  return {
    apikey: API_KEY,
    Authorization: "Bearer " + (token || API_KEY),
    "Content-Type": "application/json"
  };
}

/* CALIFICACIÓN AUTOMÁTICA */

function evaluar(respuesta, opciones, indice) {
  const texto = normalizar(respuesta);

  if (!texto) return "incorrecta";

  // Respuestas exactas.
  if (opciones.some(opcion => texto === normalizar(opcion))) {
    return "correcta";
  }

  // Música: se acepta cualquier género de la lista.
  if (indice === 4) {
    const coincide =
      generosMusicales.some(g => contieneFrase(texto,g)) ||
      respuestasGeneralesMusica.some(g => contieneFrase(texto,g));

    if (coincide) return "correcta";
  }

  // Comprobar cada alternativa de palabras clave.
  const palabras = texto.split(" ");
  const grupos = palabrasClave[indice] || [];

  for (const grupo of grupos) {
    const todasCoinciden = grupo.every(clave => {
      const partes = normalizar(clave).split(" ");
      return partes.every(parte => palabras.includes(parte));
    });

    if (todasCoinciden) return "correcta";
  }

  return "incorrecta";
}

function calcularPuntuacion(respuestasUsuario) {
  if (
    !Array.isArray(respuestasUsuario) ||
    respuestasUsuario.length !== datos.length
  ) {
    return null;
  }

  let puntos = 0;

  respuestasUsuario.forEach((respuesta,i) => {
    if (evaluar(respuesta,datos[i][1],i) === "correcta") {
      puntos++;
    }
  });

  return puntos;
}

/* TARJETAS DE RESPUESTAS */

function crearTarjetaRespuesta(respuesta,indice) {
  const esCorrecta =
    evaluar(respuesta,datos[indice][1],indice) === "correcta";

  const tarjeta = document.createElement("div");
  tarjeta.className = "result " + (esCorrecta ? "good" : "incorrect");

  const pregunta = document.createElement("strong");
  pregunta.textContent = `${indice+1}. ${datos[indice][0]}`;

  const respuestaUsuario = document.createElement("p");
  respuestaUsuario.textContent = "Tu respuesta: " + String(respuesta ?? "");

  const respuestaCorrecta = document.createElement("p");
  respuestaCorrecta.textContent =
    "Respuesta correcta: " + datos[indice][1][0];

  const calificacion = document.createElement("p");
  calificacion.className = esCorrecta
    ? "calificacion-correcta"
    : "calificacion-incorrecta";

  calificacion.textContent = esCorrecta
    ? "✓ Correcta (+1 punto)"
    : "✗ Incorrecta (0 puntos)";

  tarjeta.append(
    pregunta,respuestaUsuario,respuestaCorrecta,calificacion
  );

  return tarjeta;
}

/* HORTENSIA AZUL */

function crearHortensia() {
  const ns = "http://www.w3.org/2000/svg";
  const grupo = document.getElementById("racimoHortensia");

  grupo.replaceChildren();

  const centros = [
    [150,55],[117,65],[183,65],
    [94,88],[133,94],[170,93],[207,88],
    [76,119],[111,124],[150,127],
    [189,124],[223,119],
    [82,155],[118,158],[154,162],
    [190,158],[219,155],
    [101,191],[137,192],[174,191],
    [202,190],[126,219],[163,221],[184,216]
  ];

  centros.forEach(([x,y],i) => {
    const posicionFlor = document.createElementNS(ns,"g");
    posicionFlor.setAttribute("transform",`translate(${x} ${y})`);

    const flor = document.createElementNS(ns,"g");
    flor.setAttribute("class","florecita");
    flor.style.setProperty("--retardo",`${i*0.72}s`);

    [0,90,180,270].forEach(angulo => {
      const petalo = document.createElementNS(ns,"ellipse");
      petalo.setAttribute("cx","0");
      petalo.setAttribute("cy","-12");
      petalo.setAttribute("rx","13");
      petalo.setAttribute("ry","18");
      petalo.setAttribute("transform",`rotate(${angulo})`);
      petalo.setAttribute("fill","url(#petaloAzul)");
      petalo.setAttribute("stroke","#e5f1ff");
      petalo.setAttribute("stroke-width",".8");
      flor.appendChild(petalo);
    });

    const centro = document.createElementNS(ns,"circle");
    centro.setAttribute("r","4");
    centro.setAttribute("fill","#fff1ae");
    centro.setAttribute("class","brillo");

    flor.appendChild(centro);
    posicionFlor.appendChild(flor);
    grupo.appendChild(posicionFlor);
  });
}

crearHortensia();

function mostrarHortensia() {
  const pantalla = document.getElementById("florPantalla");
  pantalla.classList.remove("hidden");

  pantalla.style.animation = "none";
  void pantalla.offsetWidth;
  pantalla.style.animation = "";

  pantalla.querySelectorAll(".florecita").forEach(flor => {
    flor.style.animation = "none";
    void flor.getBoundingClientRect();
    flor.style.animation = "";
  });

  return new Promise(resolve => {
    setTimeout(() => {
      pantalla.classList.add("hidden");
      resolve();
    },20000);
  });
}

/* PANTALLAS */

function mostrar(id) {
  ["bienvenida","juego","final"].forEach(seccion => {
    document.getElementById(seccion).classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");
}

function mezclar(array) {
  for(let i=array.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

/* COMENZAR */

function comenzar() {
  participante = document.getElementById("nombre").value.trim();

  if(!participante) {
    alert("Escribe tu nombre.");
    return;
  }

  orden = mezclar([...Array(datos.length).keys()]);
  respuestas = Array(datos.length).fill("");
  posicion = 0;

  mostrar("juego");
  mostrarPregunta();
}

function mostrarPregunta() {
  const indice = orden[posicion];

  document.getElementById("contador").textContent =
    `Pregunta ${posicion+1} de ${datos.length}`;

  document.getElementById("barra").style.width =
    `${((posicion+1)/datos.length)*100}%`;

  document.getElementById("pregunta").textContent =
    datos[indice][0];

  document.getElementById("respuesta").value =
    respuestas[indice];

  document.getElementById("siguiente").textContent =
    posicion===datos.length-1 ? "Terminar" : "Siguiente";

  document.getElementById("estado").textContent = "";
}

function guardarTemporal() {
  respuestas[orden[posicion]] =
    document.getElementById("respuesta").value;
}

function anterior() {
  if(enviando) return;
  guardarTemporal();

  if(posicion>0) {
    posicion--;
    mostrarPregunta();
  }
}

async function siguiente() {
  if(enviando) return;

  guardarTemporal();

  if(!respuestas[orden[posicion]].trim()) {
    alert("Responde antes de continuar.");
    return;
  }

  if(posicion<datos.length-1) {
    posicion++;
    mostrarPregunta();
    return;
  }

  if(respuestas.some(r=>!r.trim())) {
    alert("Faltan preguntas por responder.");
    return;
  }

  await finalizar();
}

/* FINALIZAR Y GUARDAR */

async function finalizar() {
  if(enviando) return;
  enviando = true;

  const boton = document.getElementById("siguiente");
  const estado = document.getElementById("estado");

  boton.disabled = true;
  estado.textContent = "Calificando y guardando respuestas...";

  const puntos = calcularPuntuacion(respuestas);

  try {
    const response = await fetch(
      URL_BASE + "/rest/v1/resultados_test",
      {
        method:"POST",
        headers:{
          ...headers(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          nombre:participante,
          respuestas:respuestas,
          puntuacion:puntos,
          pendientes_revision:0
        })
      }
    );

    if(!response.ok) {
      throw new Error(await response.text());
    }

    const zona = document.getElementById("resultado");
    zona.replaceChildren();

    const titulo = document.createElement("h2");
    titulo.textContent =
      `${participante}: ${puntos}/${datos.length} puntos`;
    zona.appendChild(titulo);

    respuestas.forEach((respuesta,i) => {
      zona.appendChild(crearTarjetaRespuesta(respuesta,i));
    });

    await mostrarHortensia();
    mostrar("final");

  } catch(error) {
    console.error(error);
    estado.textContent =
      "No se pudieron guardar las respuestas. Inténtalo nuevamente.";
    alert("Hubo un problema al guardar tus respuestas.");
  } finally {
    enviando = false;
    boton.disabled = false;
  }
}

/* PANEL DE ADMINISTRACIÓN */

function mostrarAdmin() {
  const admin = document.getElementById("admin");
  const abierto = !admin.classList.contains("hidden");

  if(abierto) {
    admin.classList.add("hidden");
    admin.classList.remove("admin-pantalla");
    document.getElementById("bienvenida").classList.toggle(
      "hidden",!document.getElementById("bienvenida").dataset.visibleAntes
    );
    document.getElementById("juego").classList.toggle(
      "hidden",!document.getElementById("juego").dataset.visibleAntes
    );
    document.getElementById("final").classList.toggle(
      "hidden",!document.getElementById("final").dataset.visibleAntes
    );

    ["bienvenida","juego","final"].forEach(id => {
      delete document.getElementById(id).dataset.visibleAntes;
    });
  } else {
    ["bienvenida","juego","final"].forEach(id => {
      const elemento = document.getElementById(id);
      if(!elemento.classList.contains("hidden")) {
        elemento.dataset.visibleAntes = "1";
      }
      elemento.classList.add("hidden");
    });

    admin.classList.remove("hidden");
    admin.classList.add("admin-pantalla");
    window.scrollTo(0,0);
  }
}

/* INICIAR SESIÓN */

async function iniciarSesion() {
  const email = document.getElementById("correo").value.trim();
  const password = document.getElementById("clave").value;
  const estado = document.getElementById("estadoAdmin");

  estado.textContent = "Iniciando sesión...";
  estado.className = "";

  try {
    const response = await fetch(
      URL_BASE + "/auth/v1/token?grant_type=password",
      {
        method:"POST",
        headers:{
          apikey:API_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({email,password})
      }
    );

    const sesion = await response.json();

    if(!response.ok || !sesion.access_token) {
      throw new Error("No se pudo iniciar sesión.");
    }

    tokenAdmin = sesion.access_token;

    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");

    estado.textContent = "Sesión iniciada.";
    await cargarResultados();

  } catch(error) {
    estado.textContent = error.message;
    estado.className = "error";
  }
}

/* ACTUALIZAR PUNTUACIÓN EN SUPABASE */

async function actualizarPuntuacion(registro,puntos) {
  if(!tokenAdmin) {
    throw new Error("No hay sesión de administración.");
  }

  const response = await fetch(
    URL_BASE +
    "/rest/v1/resultados_test?id=eq." +
    encodeURIComponent(registro.id),
    {
      method:"PATCH",
      headers:{
        ...headers(tokenAdmin),
        Prefer:"return=representation"
      },
      body:JSON.stringify({
        puntuacion:puntos,
        pendientes_revision:0
      })
    }
  );

  if(!response.ok) {
    throw new Error(await response.text());
  }

  const filas = await response.json();

  if(!Array.isArray(filas) || filas.length!==1) {
    throw new Error(
      "Supabase no permitió actualizar la puntuación."
    );
  }

  return filas[0];
}

/* CARGAR Y RECALIFICAR PARTICIPACIONES */

async function cargarResultados() {
  if(cargandoAdmin) return;

  if(!tokenAdmin) {
    document.getElementById("estadoAdmin").textContent =
      "Primero inicia sesión.";
    return;
  }

  cargandoAdmin = true;

  const lista = document.getElementById("lista");
  const estado = document.getElementById("estadoAdmin");

  lista.replaceChildren();
  estado.textContent = "Cargando y recalificando resultados...";
  estado.className = "";

  try {
    const registros = [];
    const limite = 500;
    let offset = 0;

    while(true) {
      const response = await fetch(
        URL_BASE +
        "/rest/v1/resultados_test" +
        "?select=*&order=creado_en.desc,id.desc" +
        "&limit=" + limite +
        "&offset=" + offset,
        {headers:headers(tokenAdmin)}
      );

      if(!response.ok) {
        throw new Error(
          "No se pudieron consultar los resultados: " +
          await response.text()
        );
      }

      const pagina = await response.json();
      registros.push(...pagina);

      if(pagina.length<limite) break;
      offset += pagina.length;
    }

    const titulo = document.createElement("h3");
    titulo.textContent = "Participaciones: " + registros.length;
    lista.appendChild(titulo);

    let actualizados = 0;
    let errores = 0;
    let incompletos = 0;

    for(const registro of registros) {
      const div = document.createElement("div");
      div.className = "registro";

      const nombre = document.createElement("h3");
      nombre.textContent = registro.nombre || "Sin nombre";

      const respuestasGuardadas =
        Array.isArray(registro.respuestas)
          ? registro.respuestas
          : [];

      const corregida = calcularPuntuacion(respuestasGuardadas);

      const puntos = document.createElement("p");
      const mensaje = document.createElement("p");
      mensaje.className = "small";

      if(corregida===null) {
        incompletos++;
        puntos.textContent =
          `Puntuación guardada: ${registro.puntuacion}/20`;
        mensaje.textContent =
          "No se recalificó porque faltan respuestas.";
      } else {
        puntos.textContent =
          `Puntuación corregida: ${corregida}/20`;

        const necesitaActualizar =
          Number(registro.puntuacion)!==corregida ||
          Number(registro.pendientes_revision)!==0;

        if(necesitaActualizar) {
          try {
            await actualizarPuntuacion(registro,corregida);
            actualizados++;
            mensaje.textContent =
              "Puntuación corregida y guardada en Supabase.";
            mensaje.className = "success";
          } catch(error) {
            errores++;
            mensaje.textContent =
              "No se pudo guardar la puntuación corregida. " +
              `En Supabase sigue: ${registro.puntuacion}/20.`;
            mensaje.className = "error";
            console.error("Error en registro",registro.id,error);
          }
        } else {
          mensaje.textContent =
            "La puntuación guardada coincide con la corregida.";
        }
      }

      const fecha = document.createElement("p");
      fecha.className = "small";
      fecha.textContent = registro.creado_en
        ? new Date(registro.creado_en).toLocaleString("es-EC")
        : "Fecha no disponible";

      const detalles = document.createElement("details");
      const resumen = document.createElement("summary");
      resumen.textContent = "Ver las 20 respuestas";
      detalles.appendChild(resumen);

      respuestasGuardadas.forEach((respuesta,i) => {
        if(i<datos.length) {
          detalles.appendChild(
            crearTarjetaRespuesta(respuesta,i)
          );
        }
      });

      const eliminar = document.createElement("button");
      eliminar.type = "button";
      eliminar.className = "danger";
      eliminar.textContent = "Eliminar registro";
      eliminar.addEventListener("click",() => {
        eliminarRegistro(registro,eliminar);
      });

      div.append(
        nombre,puntos,fecha,detalles,mensaje,eliminar
      );
      lista.appendChild(div);
    }

    estado.textContent =
      `Participaciones: ${registros.length}. ` +
      `Actualizadas: ${actualizados}. ` +
      `Incompletas: ${incompletos}. ` +
      `Errores: ${errores}.`;

    if(errores>0) estado.className = "error";

  } catch(error) {
    console.error(error);
    estado.textContent =
      "Error al cargar resultados: " + error.message;
    estado.className = "error";
  } finally {
    cargandoAdmin = false;
  }
}

/* ELIMINAR REGISTRO */

async function eliminarRegistro(registro,boton) {
  if(!tokenAdmin) {
    alert("Inicia sesión como administradora.");
    return;
  }

  if(cargandoAdmin) {
    alert("Espera a que termine la actualización.");
    return;
  }

  const nombre = String(registro.nombre || "Sin nombre");

  if(!confirm(
    `¿Eliminar definitivamente las respuestas de "${nombre}"?`
  )) return;

  boton.disabled = true;
  boton.textContent = "Eliminando...";

  const estado = document.getElementById("estadoAdmin");

  try {
    const response = await fetch(
      URL_BASE +
      "/rest/v1/resultados_test?id=eq." +
      encodeURIComponent(registro.id),
      {
        method:"DELETE",
        headers:{
          ...headers(tokenAdmin),
          Prefer:"return=representation"
        }
      }
    );

    if(!response.ok) {
      throw new Error(await response.text());
    }

    const eliminados = await response.json();

    if(!Array.isArray(eliminados) || eliminados.length!==1) {
      throw new Error(
        "No se eliminó el registro. Revisa los permisos DELETE."
      );
    }

    await cargarResultados();
    estado.textContent =
      `Registro de "${nombre}" eliminado correctamente.`;

  } catch(error) {
    console.error(error);
    estado.textContent = error.message;
    estado.className = "error";
    boton.disabled = false;
    boton.textContent = "Eliminar registro";
  }
}

/* CERRAR SESIÓN */

function cerrarSesion() {
  if(cargandoAdmin) {
    alert("Espera a que termine la actualización.");
    return;
  }

  tokenAdmin = null;
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("lista").replaceChildren();
  document.getElementById("clave").value = "";
  document.getElementById("estadoAdmin").textContent =
    "Sesión cerrada.";
}

/* ATAJOS */

document.addEventListener("keydown",event => {
  if(
    event.key==="Enter" &&
    !event.repeat &&
    !event.ctrlKey &&
    !event.altKey &&
    !document.getElementById("juego").classList.contains("hidden") &&
    document.getElementById("admin").classList.contains("hidden") &&
    document.activeElement===document.getElementById("respuesta")
  ) {
    event.preventDefault();
    siguiente();
    return;
  }

  if(
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase()==="a" &&
    !event.target.closest("input,textarea,[contenteditable]")
  ) {
    event.preventDefault();
    mostrarAdmin();
  }
});

</script>
