
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {

}

main {
  max-width: 650px;
  margin: 30px auto;
  padding: 30px;

  border-radius: 24px;
  box-shadow: 0 12px 35px #694b8420;
}

h1, h2 {
  color: #8658a6;
  text-align: center;
}

p { line-height: 1.5; }
.center { text-align: center; }

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  font-size: 16px;
  border: 1px solid #cbb4dc;
  border-radius: 12px;
}

button {
  padding: 14px 22px;
  margin: 5px;
  font-size: 16px;
  color: white;
  background: #9166b5;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.secondary {
  background: #e8d9f2;
  color: #5b3d72;
}

.danger { background: #b94063; }
.danger:hover { background: #9f3151; }

.hidden { display: none !important; }

.progress {
  height: 12px;
  margin: 22px 0;
  background: #eee3f4;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  width: 0;
  height: 100%;
  background: #a77bd0;
  transition: width .3s;
}

.question {
  margin: 30px 0;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.result {
  padding: 15px;
  margin: 12px 0;
  background: #f7f0fb;
  border-radius: 12px;
}

.good { border-left: 5px solid #71b18a; }
.review { border-left: 5px solid #e3af68; }

.small {
  font-size: 13px;
  color: #74667c;
}

.error { color: #b63759; }
summary { cursor: pointer; padding: 8px 0; }

/* ANIMACIÓN DE HORTENSIA AZUL */

#animacionFlor {
  min-height: 390px;
  text-align: center;
  padding: 20px 0;
}

.escenaFlor {
  width: 260px;
  height: 275px;
  margin: 0 auto;
  position: relative;
}

.hortensia {
  position: absolute;
  width: 200px;
  height: 200px;
  left: 30px;
  top: 10px;
  animation: aparecerFlor 2.4s ease-out both;
  transform-origin: 50% 85%;
}

.ramillete {
  position: absolute;
  width: 200px;
  height: 200px;
  left: 0;
  top: 0;
  filter: drop-shadow(0 8px 12px #6689b544);
  animation: balanceo 3s ease-in-out infinite alternate;
}

.florcita {
  position: absolute;
  width: 50px;
  height: 50px;
  transform: translate(-50%, -50%) scale(0);
  animation: florecer .75s cubic-bezier(.2,1.6,.4,1) forwards;
  animation-delay: var(--delay);
}

.petalo {
  position: absolute;
  width: 24px;
  height: 24px;
  background: var(--azul);
  border: 1px solid #ffffff77;
  border-radius: 70% 30% 65% 35%;
  box-shadow: inset 3px 3px 6px #ffffff66;
}

.petalo:nth-child(1) {
  left: 13px;
  top: 1px;
  transform: rotate(-45deg);
}

.petalo:nth-child(2) {
  right: 1px;
  top: 13px;
  transform: rotate(45deg);
}

.petalo:nth-child(3) {
  left: 13px;
  bottom: 1px;
  transform: rotate(135deg);
}

.petalo:nth-child(4) {
  left: 1px;
  top: 13px;
  transform: rotate(225deg);
}

.centroFlor {
  position: absolute;
  width: 9px;
  height: 9px;
  left: 20px;
  top: 20px;
  background: #f4e4a0;
  border-radius: 50%;
  box-shadow: 0 0 5px #fff6;
}

.tallo {
  position: absolute;
  width: 8px;
  height: 135px;
  left: 126px;
  top: 135px;
  background: linear-gradient(90deg,#43895f,#78b68a);
  border-radius: 10px;
  transform: rotate(6deg);
  transform-origin: top;
  animation: crecerTallo 1.5s ease-out both;
}

.hoja {
  position: absolute;
  width: 67px;
  height: 35px;
  background: linear-gradient(135deg,#85c79b,#3f9262);
  border-radius: 5% 95% 5% 95%;
  transform-origin: left center;
  animation: aparecerHoja 1.5s ease-out both;
}

.hoja.izquierda {
  left: 121px;
  top: 205px;
  transform: rotate(150deg);
}

.hoja.derecha {
  left: 133px;
  top: 230px;
  transform: rotate(-25deg);
}

.mensajeFlor {
  color: #5878b8;
  font-size: 25px;
  font-weight: bold;
  margin: 8px 0;
  animation: aparecerTexto 1.5s ease 1s both;
}

.submensajeFlor {
  color: #7e79a3;
  animation: aparecerTexto 1.5s ease 1.5s both;
}

@keyframes florecer {
  from {
    transform: translate(-50%,-50%) scale(0);
    opacity: 0;
  }
  to {
    transform: translate(-50%,-50%) scale(1);
    opacity: 1;
  }
}

@keyframes aparecerFlor {
  from { opacity: 0; transform: scale(.5); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes balanceo {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}

@keyframes crecerTallo {
  from { opacity: 0; transform: scaleY(0); }
  to { opacity: 1; transform: scaleY(1); }
}

@keyframes aparecerHoja {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes aparecerTexto {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width:480px) {
  main { padding: 18px; margin: 10px auto; }
  .question { font-size: 19px; }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<main>

<section id="bienvenida">

  <p class="center">

  </p>

         placeholder="Escribe tu nombre">
  <div class="center">
    <button onclick="comenzar()">Comenzar test</button>
  </div>
</section>

<section id="juego" class="hidden">

  <div class="progress">
    <div id="barra" class="bar"></div>
  </div>
  <div id="pregunta" class="question"></div>
  <input id="respuesta" maxlength="500"
         placeholder="Escribe tu respuesta..."
         oninput="guardarTemporal()">
  <div class="navigation">
    <button id="anteriorBtn" class="secondary"
            onclick="anterior()">Anterior</button>
    <button id="siguienteBtn"
            onclick="siguiente()">Siguiente</button>
  </div>
  <p id="estado" class="center"></p>
</section>

<!-- ANIMACIÓN AL TERMINAR -->
<section id="animacionFlor" class="hidden">
  <div class="escenaFlor">
    <div class="tallo"></div>
    <div class="hoja izquierda"></div>
    <div class="hoja derecha"></div>
    <div class="hortensia">
      <div id="ramillete" class="ramillete"></div>
    </div>
  </div>
  <div class="mensajeFlor">¡Gracias por responder!</div>
  <p class="submensajeFlor">
    Una hortensia azul para ti 💙
  </p>
</section>

<section id="final" class="hidden">
  <h1>Tu resultado</h1>
  <div id="resultado"></div>
</section>

<section id="admin" class="hidden">
  <h2>Panel de administración</h2>

  <div id="login">
    <input id="correo" type="email"
           placeholder="Correo electrónico">
    <input id="clave" type="password"
           placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar sesión</button>
  </div>

  <div id="panel" class="hidden">
    <button onclick="cargarResultados()">
      Actualizar resultados
    </button>
    <button class="secondary" onclick="cerrarSesion()">
      Cerrar sesión
    </button>
    <div id="lista"></div>
  </div>

  <p id="estadoAdmin"></p>
</section>

</main>

<script>
const URL_BASE = "https://ehxrmqbthxndcfmwjhmq.supabase.co";
const API_KEY = "sb_publishable_LRVbj9lMIeAzTVJ-OxzIFA_2iHKkzRp";

const datos = [
  {
    pregunta:"¿Cuál es mi color favorito?",
    correcta:"Azul",
    opciones:["azul","el azul"]
  },
  {
    pregunta:"¿Cuándo es mi cumpleaños?",

  {

  {

  },
  {

    correcta:"Cualquier detalle pequeño",
    opciones:["cualquier detalle pequeno",

      "los detalles"]
  },
  {
    pregunta:"¿Qué es lo que más deseo conseguir en mi vida?",
    correcta:"Dinero",
    opciones:["dinero","plata","mucho dinero"]
  },
  {
    pregunta:"Si estoy pasando un mal momento, ¿qué necesitaría de ti?",
    correcta:"Palabras de apoyo y un heladito",
    opciones:["palabras de apoyo y un heladito",
      "apoyo y helado","palabras de apoyo y helado",
      "un heladito y palabras de apoyo"]
  }
];

let tokenAdmin = null;
let orden = [];
let respuestas = Array(datos.length).fill("");
let posicion = 0;
let participante = "";
let enviando = false;

function el(id) {
  return document.getElementById(id);
}

function mezclar(array) {
  for(let i=array.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function mostrar(id) {
  ["bienvenida","juego","animacionFlor","final"]
    .forEach(x=>el(x).classList.add("hidden"));
  el(id).classList.remove("hidden");
}

function comenzar() {
  participante=el("nombre").value.trim();

  if(!participante) {
    alert("Escribe tu nombre.");
    return;
  }

  orden=mezclar([...Array(datos.length).keys()]);
  respuestas=Array(datos.length).fill("");
  posicion=0;

  mostrar("juego");
  mostrarPregunta();
}

function mostrarPregunta() {
  const indice=orden[posicion];

  el("contador").textContent=
    "Pregunta "+(posicion+1)+" de "+datos.length;

  el("barra").style.width=
    ((posicion+1)/datos.length*100)+"%";

  el("pregunta").textContent=datos[indice].pregunta;
  el("respuesta").value=respuestas[indice];

  el("anteriorBtn").disabled=posicion===0;

  el("siguienteBtn").textContent=
    posicion===datos.length-1?"Terminar":"Siguiente";

  el("estado").textContent="";
  el("respuesta").focus();
}

function guardarTemporal() {
  if(orden.length) {
    respuestas[orden[posicion]]=el("respuesta").value;
  }
}

function anterior() {
  if(enviando)return;

  guardarTemporal();

  if(posicion>0) {
    posicion--;
    mostrarPregunta();
  }
}

async function siguiente() {
  if(enviando)return;

  guardarTemporal();

  if(!respuestas[orden[posicion]].trim()) {
    alert("Responde antes de continuar.");
    return;
  }

  if(posicion<datos.length-1) {
    posicion++;
    mostrarPregunta();
  } else {
    if(respuestas.some(r=>!r.trim())) {
      alert("Faltan preguntas por responder.");
      return;
    }
    await finalizar();
  }
}

function normalizar(texto) {
  return String(texto||"").toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function evaluar(respuesta,opciones) {
  const r=normalizar(respuesta);
  if(!r)return "incorrecta";

  for(const opcion of opciones) {
    const o=normalizar(opcion);

    if(r===o)return "correcta";

    if(o.length>=6 &&
       (" "+r+" ").includes(" "+o+" ") &&
       r.length<=o.length+65) {
      return "correcta";
    }
  }

  return "incorrecta";
}

function calcular(guardadas) {
  const evaluaciones=datos.map((dato,i)=>
    evaluar(guardadas[i]||"",dato.opciones)
  );

  const puntos=evaluaciones
    .filter(e=>e==="correcta").length;

  return {evaluaciones,puntos};
}

function headers(token) {
  return {
    "apikey":API_KEY,
    "Authorization":"Bearer "+(token||API_KEY),
    "Content-Type":"application/json"
  };
}

// CREAR LAS FLORES AZULES DE LA HORTENSIA
function crearHortensia() {
  const ramillete=el("ramillete");
  ramillete.replaceChildren();

  const posiciones=[
    [100,25],[70,35],[130,35],
    [45,55],[90,55],[115,60],[155,55],
    [35,85],[65,85],[100,85],[135,85],[165,85],
    [50,115],[80,115],[115,115],[150,115],
    [65,145],[100,145],[135,145],
    [85,165],[115,165]
  ];

  const colores=[
    "#76a8ed","#91bcf5","#5f91dc",
    "#a1c7f6","#6f9ce7","#8db5f1",
    "#739ddd","#b0cff8"
  ];

  posiciones.forEach(([x,y],i)=>{
    const flor=document.createElement("div");
    flor.className="florcita";
    flor.style.left=x+"px";
    flor.style.top=y+"px";
    flor.style.setProperty("--delay",(i*.075)+"s");
    flor.style.setProperty(
      "--azul",colores[i%colores.length]
    );

    for(let j=0;j<4;j++) {
      const petalo=document.createElement("span");
      petalo.className="petalo";
      flor.append(petalo);
    }

    const centro=document.createElement("span");
    centro.className="centroFlor";
    flor.append(centro);
    ramillete.append(flor);
  });
}

// MOSTRAR LA ANIMACIÓN ANTES DE LOS RESULTADOS
function animarHortensia() {
  mostrar("animacionFlor");
  crearHortensia();

  return new Promise(resolve=>{
    setTimeout(resolve,3000);
  });
}

// GUARDAR PARTICIPACIÓN Y MOSTRAR FLOR
async function finalizar() {
  if(enviando)return;

  enviando=true;
  const boton=el("siguienteBtn");
  boton.disabled=true;
  el("estado").textContent="Guardando respuestas...";

  const {evaluaciones,puntos}=calcular(respuestas);

  try {
    const r=await fetch(
      URL_BASE+"/rest/v1/resultados_test",{
        method:"POST",
        headers:{
          ...headers(),
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          nombre:participante,
          respuestas:respuestas,
          puntuacion:puntos,
          pendientes_revision:0
        })
      }
    );

    if(!r.ok)throw new Error(await r.text());

    // Primero florece la hortensia azul
    await animarHortensia();

    // Después aparecen los resultados
    mostrar("final");
    const zona=el("resultado");
    zona.replaceChildren();

    const titulo=document.createElement("h2");
    titulo.textContent=participante+": "+puntos+"/20";

    const mensaje=document.createElement("p");
    mensaje.textContent=
      "Estas son tus respuestas y las respuestas correctas.";

    zona.append(titulo,mensaje);

    respuestas.forEach((respuesta,i)=>{
      const div=document.createElement("div");
      div.className="result "+
        (evaluaciones[i]==="correcta"?"good":"review");

      const pregunta=document.createElement("strong");
      pregunta.textContent=
        (i+1)+". "+datos[i].pregunta;

      const tuya=document.createElement("p");
      tuya.textContent="Tu respuesta: "+respuesta;

      const correcta=document.createElement("p");
      correcta.textContent=
        "Respuesta correcta: "+datos[i].correcta;

      const estado=document.createElement("small");
      estado.textContent=
        evaluaciones[i]==="correcta"
          ?"Correcta":"Incorrecta";

      div.append(pregunta,tuya,correcta,estado);
      zona.append(div);
    });

  } catch(error) {
    console.error(error);
    el("estado").textContent=
      "No se pudieron guardar las respuestas.";
    mostrar("juego");
  } finally {
    enviando=false;
    boton.disabled=false;
  }
}

// PANEL DE ADMINISTRACIÓN
function mostrarAdmin() {
  el("admin").classList.toggle("hidden");

  if(!el("admin").classList.contains("hidden")) {
    el("admin").scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

async function iniciarSesion() {
  const email=el("correo").value.trim();
  const password=el("clave").value;
  const estado=el("estadoAdmin");

  estado.textContent="Iniciando sesión...";
  estado.className="";

  try {
    const r=await fetch(
      URL_BASE+"/auth/v1/token?grant_type=password",{
        method:"POST",
        headers:{
          "apikey":API_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({email,password})
      }
    );

    const d=await r.json();

    if(!r.ok||!d.access_token) {
      throw new Error("Correo o contraseña incorrectos.");
    }

    tokenAdmin=d.access_token;
    el("login").classList.add("hidden");
    el("panel").classList.remove("hidden");
    estado.textContent="Sesión iniciada.";

    await cargarResultados();

  } catch(error) {
    estado.textContent=error.message;
    estado.className="error";
  }
}

// CARGAR RESULTADOS CON BOTONES DE ELIMINACIÓN
async function cargarResultados() {
  const lista=el("lista");
  const estado=el("estadoAdmin");

  lista.replaceChildren();
  estado.className="";
  estado.textContent="Cargando resultados...";

  if(!tokenAdmin) {
    estado.textContent="Primero inicia sesión.";
    return;
  }

  try {
    const r=await fetch(
      URL_BASE+
      "/rest/v1/resultados_test?select=*&order=creado_en.desc&limit=500",
      {headers:headers(tokenAdmin)}
    );

    if(!r.ok)throw new Error(await r.text());

    const registros=await r.json();

    const titulo=document.createElement("h3");
    titulo.textContent="Participaciones: "+registros.length;
    lista.append(titulo);

    registros.forEach(registro=>{
      const div=document.createElement("div");
      div.className="result";

      const nombre=document.createElement("h3");
      nombre.textContent=registro.nombre;

      const guardadas=Array.isArray(registro.respuestas)
        ?registro.respuestas:[];

      const {evaluaciones,puntos}=calcular(guardadas);

      const puntuacion=document.createElement("p");
      puntuacion.textContent=
        "Calificación automática actual: "+puntos+"/20";

      const fecha=document.createElement("p");
      fecha.className="small";
      fecha.textContent=
        new Date(registro.creado_en)
          .toLocaleString("es-EC");

      const detalles=document.createElement("details");
      const resumen=document.createElement("summary");
      resumen.textContent="Ver las 20 respuestas";
      detalles.append(resumen);

      datos.forEach((dato,i)=>{
        const item=document.createElement("div");
        item.className="result "+
          (evaluaciones[i]==="correcta"?"good":"review");

        const pregunta=document.createElement("strong");
        pregunta.textContent=(i+1)+". "+dato.pregunta;

        const respuesta=document.createElement("p");
        respuesta.textContent=
          "Respondió: "+(guardadas[i]||"(Sin respuesta)");

        const correcta=document.createElement("p");
        correcta.textContent=
          "Respuesta correcta: "+dato.correcta;

        item.append(pregunta,respuesta,correcta);
        detalles.append(item);
      });

      const eliminar=document.createElement("button");
      eliminar.type="button";
      eliminar.className="danger";
      eliminar.textContent="Eliminar registro";

      eliminar.addEventListener("click",()=>{
        eliminarRegistro(registro,eliminar);
      });

      div.append(
        nombre,puntuacion,fecha,detalles,eliminar
      );
      lista.append(div);
    });

    estado.textContent="Resultados cargados.";

  } catch(error) {
    console.error(error);
    estado.className="error";
    estado.textContent="Error: "+error.message;
  }
}

// ELIMINAR REGISTROS EN SUPABASE
async function eliminarRegistro(registro,boton) {
  if(!tokenAdmin) {
    alert("Debes iniciar sesión como administradora.");
    return;
  }

  const nombre=String(registro.nombre||"Sin nombre");

  const confirmar=confirm(
    '¿Eliminar definitivamente las respuestas de "'+
    nombre+'"? Esta acción no se puede deshacer.'
  );

  if(!confirmar)return;

  boton.disabled=true;
  boton.textContent="Eliminando...";

  const estado=el("estadoAdmin");

  try {
    const r=await fetch(
      URL_BASE+
      "/rest/v1/resultados_test?id=eq."+
      encodeURIComponent(registro.id),
      {
        method:"DELETE",
        headers:{
          ...headers(tokenAdmin),
          "Prefer":"return=representation"
        }
      }
    );

    if(!r.ok) {
      throw new Error(
        "Supabase rechazó la eliminación: "+
        await r.text()
      );
    }

    const eliminados=await r.json();

    if(!Array.isArray(eliminados)||
       eliminados.length!==1) {
      throw new Error(
        "No se eliminó el registro. "+
        "Revisa los permisos de Supabase."
      );
    }

    await cargarResultados();

    estado.textContent=
      'Registro de "'+nombre+
      '" eliminado correctamente.';

  } catch(error) {
    console.error(error);
    estado.className="error";
    estado.textContent=error.message;
    boton.disabled=false;
    boton.textContent="Eliminar registro";
  }
}

function cerrarSesion() {
  tokenAdmin=null;
  el("panel").classList.add("hidden");
  el("login").classList.remove("hidden");
  el("lista").replaceChildren();
  el("clave").value="";
  el("estadoAdmin").textContent="Sesión cerrada.";
}

// ATAJOS DE TECLADO
document.addEventListener("keydown",function(event) {
  if(event.key==="Enter" &&
     !event.repeat &&
     !event.ctrlKey &&
     !event.altKey &&
     !el("juego").classList.contains("hidden") &&
     document.activeElement===el("respuesta")) {
    event.preventDefault();
    siguiente();
    return;
  }

  if((event.ctrlKey||event.metaKey) &&
     event.key.toLowerCase()==="a" &&
     !event.target.matches(
       "input,textarea,[contenteditable]"
     )) {
    event.preventDefault();
    mostrarAdmin();
  }
});
</script>
