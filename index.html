
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué tanto me conoces?</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #493951;
  background: linear-gradient(135deg,#fce8f5,#e8e5ff,#e5f5fa);
}
main {
  max-width: 700px;
  margin: 28px auto;
  padding: 28px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 12px 35px #654b8420;
}
h1,h2 { color: #885eac; text-align: center; }
h3 { color: #684789; }
p { line-height: 1.5; }
.center { text-align: center; }
.hidden { display: none !important; }
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  font-size: 16px;
  border: 1px solid #cbb4dc;
  border-radius: 12px;
}
button {
  padding: 13px 20px;
  margin: 5px;
  font-size: 15px;
  color: white;
  background: #9068b4;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: wait; }
.secondary { background: #e9ddf3; color: #563a70; }
.progress {
  height: 12px;
  background: #eee4f5;
  border-radius: 20px;
  overflow: hidden;
  margin: 22px 0;
}
.bar {
  height: 100%;
  width: 0;
  background: #ab80d0;
  transition: width .25s;
}
.question {
  margin: 30px 0;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
.navigation {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.result {
  padding: 16px;
  margin: 13px 0;
  background: #f8f2fc;
  border-radius: 14px;
}
.good { border-left: 5px solid #76b28e; }
.bad { border-left: 5px solid #d77b8a; }
.small { font-size: 13px; color: #766880; }
.error { color: #b63857; }
summary { cursor: pointer; font-weight: bold; padding: 8px 0; }
@media(max-width:480px) {
  main { padding: 18px; margin: 10px auto; }
  .question { font-size: 19px; }
}
</style>
</head>

<body>
<main>

<section id="bienvenida">
  <h1>💜 ¿Qué tanto me conoces?</h1>
  <p class="center">
    Responde 20 preguntas y descubre cuánto sabes de mí.
    Cada participante recibe las preguntas en un orden diferente.
  </p>
  <input id="nombre" maxlength="80" placeholder="Escribe tu nombre">
  <div class="center">
    <button onclick="comenzar()">Comenzar test</button>
  </div>
</section>

<section id="juego" class="hidden">
  <p id="contador" class="center"></p>
  <div class="progress"><div id="barra" class="bar"></div></div>
  <div id="pregunta" class="question"></div>
  <input id="respuesta" maxlength="500"
         placeholder="Escribe tu respuesta..."
         oninput="guardarTemporal()">
  <div class="navigation">
    <button id="anteriorBtn" class="secondary"
            onclick="anterior()">Anterior</button>
    <button id="siguienteBtn" onclick="siguiente()">Siguiente</button>
  </div>
  <p class="small center">Presiona Enter para continuar.</p>
  <p id="estado" class="center"></p>
</section>

<section id="final" class="hidden">
  <h1>Tu resultado</h1>
  <div id="resultado"></div>
</section>

<section id="admin" class="hidden">
  <h2>Panel de administración</h2>

  <div id="login">
    <input id="correo" type="email"
           placeholder="Correo electrónico">
    <input id="clave" type="password"
           placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar sesión</button>
  </div>

  <div id="panel" class="hidden">
    <button onclick="cargarResultados()">Actualizar resultados</button>
    <button class="secondary" onclick="cerrarSesion()">
      Cerrar sesión
    </button>
    <div id="lista"></div>
  </div>

  <p id="estadoAdmin"></p>
</section>

</main>

<script>
// CONEXIÓN CON SUPABASE
const URL_BASE = "https://ehxrmqbthxndcfmwjhmq.supabase.co";
const API_KEY = "sb_publishable_LRVbj9lMIeAzTVJ-OxzIFA_2iHKkzRp";

// Cada pregunta contiene:
// texto, respuesta oficial, respuestas alternativas aceptadas.
const datos = [
  {
    pregunta: "¿Cuál es mi color favorito?",
    correcta: "Azul",
    opciones: ["azul", "el azul"]
  },
  {
    pregunta: "¿Cuándo es mi cumpleaños?",
    correcta: "28 de noviembre",
    opciones: ["28 de noviembre", "28 noviembre", "28/11", "noviembre 28"]
  },
  {
    pregunta: "¿Cuál es mi comida favorita?",
    correcta: "Cualquier tipo de carne",
    opciones: ["cualquier tipo de carne", "cualquier carne",
      "todo tipo de carne", "carne", "carnes"]
  },
  {
    pregunta: "¿Prefiero el día o la noche?",
    correcta: "La noche",
    opciones: ["noche", "la noche"]
  },
  {
    pregunta: "¿Cuál es mi canción favorita?",
    correcta: "Todos los géneros musicales",
    opciones: ["todos los generos", "todos los generos musicales",
      "cualquier genero", "cualquier genero musical",
      "todo tipo de musica", "todos"]
  },
  {
    pregunta: "¿Qué es lo que más me hace enojar?",
    correcta: "Cuando se meten con los animales, conmigo o con mi familia",
    opciones: ["cuando se meten con los animales",
      "cuando se meten conmigo", "cuando se meten con mi familia",
      "que se metan con los animales", "que se metan conmigo",
      "que se metan con mi familia", "maltrato animal",
      "maltratar animales", "se meten con mi familia"]
  },
  {
    pregunta: "¿Qué hago cuando estoy triste?",
    correcta: "Lloro y veo vídeos graciosos",
    opciones: ["lloro y veo videos graciosos",
      "lloro y miro videos graciosos",
      "llorar y ver videos graciosos",
      "lloro y veo videos divertidos"]
  },
  {
    pregunta: "¿Soy más de salir o quedarme en casa?",
    correcta: "Quedarme en casa",
    opciones: ["quedarme en casa", "estar en casa",
      "quedarse en casa", "casa", "en casa"]
  },
  {
    pregunta: "¿Cuál es uno de mis mayores sueños?",
    correcta: "Tener una cafetería de gatitos",
    opciones: ["tener una cafeteria de gatitos",
      "cafeteria de gatitos", "cafeteria de gatos",
      "cafeteria con gatitos", "cafe de gatos"]
  },
  {
    pregunta: "¿Qué tipo de personas me caen mal?",
    correcta: "Las personas presumidas y creídas",
    opciones: ["presumidas y creidas", "presumidas",
      "creidas", "arrogantes", "engreidas",
      "personas presumidas", "personas creidas"]
  },
  {
    pregunta: "¿Cuál es mi mayor miedo?",
    correcta: "Quedarme sola por mis acciones",
    opciones: ["quedarme sola por mis acciones",
      "quedar sola por mis acciones",
      "quedarme sola por lo que hago",
      "quedarme sola por mis decisiones"]
  },
  {
    pregunta: "¿Cómo demuestro cariño?",
    correcta: "Con abrazos, detalles y pasando tiempo con las personas",
    opciones: ["abrazos", "detalles", "pasando tiempo",
      "tiempo de calidad", "abrazos y detalles",
      "abrazos detalles y tiempo de calidad",
      "con abrazos detalles y pasando tiempo con las personas"]
  },
  {
    pregunta: "¿Qué inseguridad tengo?",
    correcta: "Mi físico",
    opciones: ["mi fisico", "fisico",
      "mi apariencia fisica", "apariencia fisica",
      "mi cuerpo"]
  },
  {
    pregunta: "¿Qué es lo que más valoro en una amistad?",
    correcta: "Honestidad y lealtad",
    opciones: ["honestidad y lealtad",
      "lealtad y honestidad", "honestidad", "lealtad"]
  },
  {
    pregunta: "¿Qué cosa me puede hacer llorar fácilmente?",
    correcta: "Cuando me esconden la comida o cuando no me escuchan",
    opciones: ["me esconden la comida", "esconden mi comida",
      "que me escondan la comida", "cuando no me escuchan",
      "no me escuchan", "que no me escuchen"]
  },
  {
    pregunta: "¿Qué hago cuando alguien me decepciona?",
    correcta: "Le aplico la ley del hielo por unos cuantos días",
    opciones: ["ley del hielo", "le aplico la ley del hielo",
      "le aplico la ley del hielo por unos cuantos dias",
      "le dejo de hablar unos dias", "no le hablo por dias",
      "dejo de hablarle por varios dias"]
  },
  {
    pregunta: "¿Qué es algo que nunca perdonaría?",
    correcta: "La traición o la decepción",
    opciones: ["traicion", "la traicion",
      "decepcion", "la decepcion",
      "traicion o decepcion", "una traicion",
      "una decepcion"]
  },
  {
    pregunta: "¿Qué pequeño detalle me hace muy feliz?",
    correcta: "Cualquier detalle pequeño",
    opciones: ["cualquier detalle pequeno",
      "cualquier detallito", "los pequenos detalles",
      "un pequeno detalle", "cualquier gesto bonito",
      "los detalles", "detallitos"]
  },
  {
    pregunta: "¿Qué es lo que más deseo conseguir en mi vida?",
    correcta: "Dinero",
    opciones: ["dinero", "plata", "mucho dinero"]
  },
  {
    pregunta: "Si estoy pasando un mal momento, ¿qué necesitaría de ti?",
    correcta: "Palabras de apoyo y un heladito",
    opciones: ["palabras de apoyo y un heladito",
      "apoyo y helado", "palabras de apoyo y helado",
      "que me apoyen y me den un helado",
      "un heladito y palabras de apoyo"]
  }
];

let orden = [];
let respuestas = Array(datos.length).fill("");
let posicion = 0;
let participante = "";
let enviando = false;
let tokenAdmin = null;

function el(id) {
  return document.getElementById(id);
}

function mezclar(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function mostrar(id) {
  ["bienvenida", "juego", "final"].forEach(x => {
    el(x).classList.add("hidden");
  });
  el(id).classList.remove("hidden");
}

function comenzar() {
  participante = el("nombre").value.trim();
  if (!participante) {
    alert("Primero escribe tu nombre.");
    return;
  }

  orden = mezclar([...Array(datos.length).keys()]);
  respuestas = Array(datos.length).fill("");
  posicion = 0;
  mostrar("juego");
  mostrarPregunta();
}

function mostrarPregunta() {
  const indice = orden[posicion];
  el("contador").textContent =
    "Pregunta " + (posicion + 1) + " de " + datos.length;
  el("barra").style.width =
    ((posicion + 1) / datos.length * 100) + "%";
  el("pregunta").textContent = datos[indice].pregunta;
  el("respuesta").value = respuestas[indice];
  el("anteriorBtn").disabled = posicion === 0;
  el("siguienteBtn").textContent =
    posicion === datos.length - 1 ? "Terminar" : "Siguiente";
  el("estado").textContent = "";
  el("respuesta").focus();
}

function guardarTemporal() {
  if (orden.length) {
    respuestas[orden[posicion]] = el("respuesta").value;
  }
}

function anterior() {
  if (enviando) return;
  guardarTemporal();
  if (posicion > 0) {
    posicion--;
    mostrarPregunta();
  }
}

async function siguiente() {
  if (enviando) return;
  guardarTemporal();

  if (!respuestas[orden[posicion]].trim()) {
    alert("Responde antes de continuar.");
    el("respuesta").focus();
    return;
  }

  if (posicion < datos.length - 1) {
    posicion++;
    mostrarPregunta();
    return;
  }

  if (respuestas.some(r => !r.trim())) {
    alert("Faltan preguntas por responder.");
    return;
  }

  await finalizar();
}

// NORMALIZAR RESPUESTAS
function normalizar(texto) {
  return String(texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// CORRECCIÓN AUTOMÁTICA
function evaluar(respuesta, opciones) {
  const r = normalizar(respuesta);
  if (!r) return "incorrecta";

  const negaciones = [
    "no es", "no son", "no me gusta",
    "no prefiero", "no quiero", "no hago"
  ];

  if (negaciones.some(n => r.startsWith(n + " "))) {
    return "incorrecta";
  }

  for (const opcion of opciones) {
    const o = normalizar(opcion);

    if (r === o) return "correcta";

    // Aceptar la respuesta dentro de una frase más larga.
    if (o.length >= 6 &&
        (" " + r + " ").includes(" " + o + " ") &&
        r.length <= o.length + 65) {
      return "correcta";
    }
  }

  return "incorrecta";
}

function calcular(respuestasGuardadas) {
  const evaluaciones = datos.map((dato, i) =>
    evaluar(respuestasGuardadas[i] || "", dato.opciones)
  );
  const puntos = evaluaciones.filter(e => e === "correcta").length;
  return { evaluaciones, puntos };
}

function headers(token) {
  return {
    "apikey": API_KEY,
    "Authorization": "Bearer " + (token || API_KEY),
    "Content-Type": "application/json"
  };
}

// GUARDAR RESPUESTAS EN SUPABASE
async function finalizar() {
  if (enviando) return;
  enviando = true;

  const boton = el("siguienteBtn");
  boton.disabled = true;
  el("estado").textContent = "Guardando respuestas...";

  const { evaluaciones, puntos } = calcular(respuestas);

  try {
    const response = await fetch(
      URL_BASE + "/rest/v1/resultados_test",
      {
        method: "POST",
        headers: {
          ...headers(),
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          nombre: participante,
          respuestas: respuestas,
          puntuacion: puntos,
          pendientes_revision: 0
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    mostrar("final");
    const zona = el("resultado");
    zona.replaceChildren();

    const titulo = document.createElement("h2");
    titulo.textContent =
      participante + ": " + puntos + "/" + datos.length;

    const mensaje = document.createElement("p");
    mensaje.className = "center";
    mensaje.textContent =
      "Estas son tus respuestas y las respuestas correctas.";

    zona.append(titulo, mensaje);

    respuestas.forEach((respuesta, i) => {
      const div = document.createElement("div");
      const acierto = evaluaciones[i] === "correcta";
      div.className = "result " + (acierto ? "good" : "bad");

      const pregunta = document.createElement("strong");
      pregunta.textContent = (i + 1) + ". " + datos[i].pregunta;

      const tuya = document.createElement("p");
      tuya.textContent = "Tu respuesta: " + respuesta;

      const correcta = document.createElement("p");
      correcta.textContent =
        "Respuesta correcta: " + datos[i].correcta;

      const estado = document.createElement("strong");
      estado.textContent = acierto ? "Correcta" : "Incorrecta";

      div.append(pregunta, tuya, correcta, estado);
      zona.append(div);
    });

  } catch (error) {
    console.error(error);
    el("estado").textContent =
      "No se pudieron guardar las respuestas. Inténtalo de nuevo.";
  } finally {
    enviando = false;
    boton.disabled = false;
  }
}

// PANEL DE ADMINISTRACIÓN
function mostrarAdmin() {
  el("admin").classList.toggle("hidden");

  if (!el("admin").classList.contains("hidden")) {
    el("admin").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }
}

async function iniciarSesion() {
  const email = el("correo").value.trim();
  const password = el("clave").value;
  const estado = el("estadoAdmin");

  estado.textContent = "Iniciando sesión...";
  estado.className = "";

  try {
    const response = await fetch(
      URL_BASE + "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        headers: {
          "apikey": API_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.access_token) {
      throw new Error("Correo o contraseña incorrectos.");
    }

    tokenAdmin = data.access_token;
    el("login").classList.add("hidden");
    el("panel").classList.remove("hidden");

    estado.textContent = "Sesión iniciada.";
    await cargarResultados();

  } catch (error) {
    estado.textContent = error.message;
    estado.className = "error";
  }
}

async function cargarResultados() {
  const lista = el("lista");
  const estado = el("estadoAdmin");

  lista.replaceChildren();
  estado.textContent = "Cargando resultados...";

  if (!tokenAdmin) {
    estado.textContent = "Primero inicia sesión.";
    return;
  }

  try {
    const response = await fetch(
      URL_BASE +
      "/rest/v1/resultados_test?select=*&order=creado_en.desc&limit=500",
      { headers: headers(tokenAdmin) }
    );

    if (!response.ok) {
      throw new Error("No se pudieron consultar los resultados.");
    }

    const registros = await response.json();

    const titulo = document.createElement("h3");
    titulo.textContent = "Participaciones: " + registros.length;
    lista.append(titulo);

    registros.forEach(registro => {
      const div = document.createElement("div");
      div.className = "result";

      const nombre = document.createElement("h3");
      nombre.textContent = registro.nombre;

      const guardadas = Array.isArray(registro.respuestas)
        ? registro.respuestas : [];

      const { evaluaciones, puntos } = calcular(guardadas);

      const puntuacion = document.createElement("p");
      puntuacion.textContent =
        "Calificación automática actual: " +
        puntos + "/" + datos.length;

      const fecha = document.createElement("p");
      fecha.className = "small";
      fecha.textContent = new Date(
        registro.creado_en
      ).toLocaleString("es-EC");

      const detalles = document.createElement("details");
      const resumen = document.createElement("summary");
      resumen.textContent = "Ver las 20 respuestas";
      detalles.append(resumen);

      datos.forEach((dato, i) => {
        const item = document.createElement("div");
        item.className = "result " +
          (evaluaciones[i] === "correcta" ? "good" : "bad");

        const pregunta = document.createElement("strong");
        pregunta.textContent = (i + 1) + ". " + dato.pregunta;

        const respuesta = document.createElement("p");
        respuesta.textContent =
          "Respondió: " + (guardadas[i] || "(Sin respuesta)");

        const correcta = document.createElement("p");
        correcta.textContent =
          "Respuesta correcta: " + dato.correcta;

        const estadoRespuesta = document.createElement("small");
        estadoRespuesta.textContent =
          evaluaciones[i] === "correcta" ? "Correcta" : "Incorrecta";

        item.append(pregunta, respuesta, correcta, estadoRespuesta);
        detalles.append(item);
      });

      div.append(nombre, puntuacion, fecha, detalles);
      lista.append(div);
    });

    estado.textContent = "Resultados cargados.";

  } catch (error) {
    console.error(error);
    estado.textContent = error.message;
    estado.className = "error";
  }
}

function cerrarSesion() {
  tokenAdmin = null;
  el("panel").classList.add("hidden");
  el("login").classList.remove("hidden");
  el("lista").replaceChildren();
  el("clave").value = "";
  el("estadoAdmin").textContent = "Sesión cerrada.";
}

// ATAJOS DE TECLADO
document.addEventListener("keydown", function(event) {

  // Ctrl + A abre el panel oculto, excepto al escribir.
  if ((event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "a" &&
      !event.altKey) {

    const destino = event.target;
    if (destino.matches("input,textarea,[contenteditable]")) return;

    event.preventDefault();
    mostrarAdmin();
    return;
  }

  // Enter avanza a la siguiente pregunta.
  if (event.key === "Enter" &&
      !event.repeat &&
      !event.ctrlKey &&
      !event.altKey &&
      !event.metaKey &&
      !el("juego").classList.contains("hidden") &&
      document.activeElement === el("respuesta")) {

    event.preventDefault();

    if (!el("siguienteBtn").disabled) {
      siguiente();
    }
  }
});
</script>
</body>
</html>
